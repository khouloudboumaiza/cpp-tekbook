name: CI
on: push

env:
  BUILD_TYPE: Release
  APP_NAME: cpp-tekbook
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ hashFiles('CMakeLists.txt') }}-
      - name: Build
        run: |
          echo "Build de $APP_NAME en mode $BUILD_TYPE"
          echo "Commit ${GITHUB_SHA::8} sur la branche $GITHUB_REF_NAME"
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake ccache
          ccache -z
          cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j2
          ccache -s
          ls -lh build/tekbook_app build/run_tests
      - uses: actions/upload-artifact@v4
        with:
          name: binaires
          path: |
            build/tekbook_app
            build/run_tests
          retention-days: 7

  unit-tests:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaires
          path: build
      - run: chmod +x build/run_tests build/tekbook_app
      - run: ./build/run_tests

  smoke-test:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaires
          path: build
      - run: chmod +x build/tekbook_app
      - run: ./build/tekbook_app | grep "2 + 3 = 5"

  static-analysis:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck
      - run: cppcheck --enable=warning --error-exitcode=1 src/ include/
